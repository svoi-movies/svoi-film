services:
  streaming:
    image: local/streaming:latest
    build:
      context: ".."
      dockerfile: "streaming/Dockerfile"
      args:
        - MCS_NAME=streaming
    restart: no
    networks:
      - microservices
      - streaming-internal
    ports:
      - 8005:8000
    env_file:
      - .dev/.env
    environment:
      - APP_DB__DSN=postgresql+asyncpg://streaming:streaming@streaming-db:5432/streaming
      - APP_RABBIT__DSN=amqp://rabbitmq:rabbitmq@rabbitmq:5672
      - APP_S3__ENDPOINT_URL=http://minio:9000
      - APP_S3__ACCESS_KEY_ID=minioadmin
      - APP_S3__SECRET_ACCESS_KEY=minioadmin
      - APP_S3__BUCKET_NAME=streaming-videos
    volumes:
      - .dev/secrets:/var/run/secrets
    depends_on:
      - streaming-db
      - minio

  streaming-worker:
    image: local/streaming:latest
    build:
      context: ".."
      dockerfile: "streaming/Dockerfile"
      args:
        - MCS_NAME=streaming
    command: python -m streaming.worker
    restart: no
    networks:
      - microservices
      - streaming-internal
    env_file:
      - .dev/.env
    environment:
      - APP_DB__DSN=postgresql+asyncpg://streaming:streaming@streaming-db:5432/streaming
      - APP_RABBIT__DSN=amqp://rabbitmq:rabbitmq@rabbitmq:5672
      - APP_S3__ENDPOINT_URL=http://minio:9000
      - APP_S3__ACCESS_KEY_ID=minioadmin
      - APP_S3__SECRET_ACCESS_KEY=minioadmin
      - APP_S3__BUCKET_NAME=streaming-videos
    volumes:
      - .dev/secrets:/var/run/secrets
    depends_on:
      - streaming-db
      - minio

  streaming-outbox-worker:
    image: local/streaming:latest
    build:
      context: ".."
      dockerfile: "streaming/Dockerfile"
      args:
        - MCS_NAME=streaming
    command: python -m commons.outbox.worker
    restart: no
    networks:
      - microservices
      - streaming-internal
    environment:
      - OUTBOX_POSTGRES_DSN=postgresql://streaming:streaming@streaming-db:5432/streaming
      - OUTBOX_RABBITMQ_DSN=amqp://rabbitmq:rabbitmq@rabbitmq:5672/
    depends_on:
      - streaming-db

  streaming-db:
    image: postgres:17.4
    environment:
      - "POSTGRES_USER=streaming"
      - "POSTGRES_PASSWORD=streaming"
      - "POSTGRES_DB=streaming"
    ports:
      - 55432:5432
    networks:
      - streaming-internal
    volumes:
      - streaming-pgdata:/var/lib/postgresql

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - 9000:9000
      - 9001:9001
    networks:
      - streaming-internal
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - streaming-internal
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/streaming-videos --ignore-existing;
      mc anonymous set download myminio/streaming-videos;
      exit 0;
      "
networks:
  microservices:
    driver: bridge
  streaming-internal:
    driver: bridge

volumes:
  streaming-pgdata:
  minio-data:
  rabbitmq-data:
