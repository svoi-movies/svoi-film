services:
  content-owner:
    image: local/content-owner:latest
    build:
      context: ".."
      dockerfile: "content-owner/Dockerfile"
    restart: no
    command: ["python", "-m", "uvicorn", "--host", "0.0.0.0", "--port", "8003", "--workers", "1", "--factory", "content_owner.api:create_app"]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8003/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    env_file:
      - .dev/.env
    environment:
      - APP_DB__DSN=postgresql+asyncpg://content_owner:content_owner@content-owner-db:5432/content_owner
      - APP_DB__EXPIRE_ON_COMMIT=false
      - APP_RABBIT__DSN=amqp://rabbitmq:rabbitmq@rabbitmq:5672/
      - APP_AUTH__TOKEN_URL=http://localhost:8001/auth/login
      - APP_AUTH__REFRESH_URL=http://localhost:8001/auth/refresh
      - APP_AUTH_CLIENT__BASE_URL=http://auth:8001
    volumes:
      - .dev/secrets:/var/run/secrets
    depends_on:
      - content-owner-db
    networks:
      - microservices

  content-owner-outbox-worker:
    image: local/content-owner:latest
    build:
      context: ".."
      dockerfile: "content-owner/Dockerfile"
    command: python -m commons.outbox.worker
    restart: unless-stopped
    environment:
      - OUTBOX_POSTGRES_DSN=postgresql://content_owner:content_owner@content-owner-db:5432/content_owner
      - OUTBOX_RABBITMQ_DSN=amqp://rabbitmq:rabbitmq@rabbitmq:5672/
      - APP_RABBIT__DSN=amqp://rabbitmq:rabbitmq@rabbitmq:5672/
    depends_on:
      - content-owner-db
    networks:
      - microservices

  content-owner-db:
    image: postgres:17.4
    environment:
      - "POSTGRES_USER=content_owner"
      - "POSTGRES_PASSWORD=content_owner"
      - "POSTGRES_DB=content_owner"
    ports:
      - 35432:5432
    volumes:
      - content-owner-pgdata:/var/lib/postgresql
    networks:
      - microservices

volumes:
  content-owner-pgdata:

networks:
  microservices:
    name: microservices
