name: Auth Service CI/CD

on:
  push:
    branches:
      - main
      - subscribes-service
    paths:
      - "auth/**"
      - "commons/**"
      - ".github/workflows/auth-service.yml"
  pull_request:
    branches:
      - main
    paths:
      - "auth/**"
      - "commons/**"

env:
  REGISTRY: cr.yandex
  SERVICE_NAME: auth-service
  MCS_NAME: auth

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    env:
      # Test environment variables from tests/.env
      APP_SECRET_DIR_PATH: ./auth/tests/secrets
      APP_AUTH__TOKEN_URL: http://localhost:8000/auth/login
      APP_AUTH__REFRESH_URL: http://localhost:8000/auth/refresh
      APP_DB__EXPIRE_ON_COMMIT: false
      APP_JWT__ACCESS_KEY_TTL: PT5M

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.17"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            auth/.venv
          key: ${{ runner.os }}-uv-${{ hashFiles('auth/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Setup test secrets
        working-directory: ./auth
        run: |
          mkdir -p tests/secrets/jwt
          # Generate test JWT keys
          openssl genrsa -out tests/secrets/jwt/signing_key 2048
          openssl rsa -in tests/secrets/jwt/signing_key -pubout -out tests/secrets/jwt/verifying_key

      - name: Install dependencies
        working-directory: ./auth
        run: |
          uv sync --group tests --group dev

      - name: Run linter (ruff)
        working-directory: ./auth
        run: |
          uv run ruff check src/ tests/

      - name: Run formatter check (ruff)
        working-directory: ./auth
        run: |
          uv run ruff format --check src/ tests/

      - name: Run type checker (mypy)
        working-directory: ./auth
        run: |
          uv run mypy src/
        continue-on-error: true

      - name: Run unit tests
        working-directory: ./auth
        run: |
          uv run pytest tests/unit -v --tb=short

      - name: Run integration tests
        working-directory: ./auth
        run: |
          uv run pytest tests/integrations -v --tb=short

  build-and-push-to-yc:
    name: Build and Push to YC
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/subscribes-service')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to YC Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: json_key
          password: ${{ secrets.YC_KEYS }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./auth/Dockerfile
          push: true
          build-args: |
            MCS_NAME=${{ env.MCS_NAME }}
          tags: |
            ${{ env.REGISTRY }}/svoi-film-auth-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    name: Deploy to Serverless Containers
    runs-on: ubuntu-latest
    needs: [build-and-push-to-yc]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy serverless container
        id: deploy
        uses: yc-actions/yc-sls-container-deploy@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_KEYS }}
          container-name: svoi-film-auth-service
          folder-id: ${{ secrets.YC_FOLDER_ID }}
          revision-image-url: cr.yandex/${{ secrets.REGISTRY }}/svoi-film-auth-service:latest
          revision-service-account-id: ${{ secrets.YC_SA_ID }}
          revision-cores: 1
          revision-memory: 512Mb
          revision-core-fraction: 100
          revision-concurrency: 4
          revision-execution-timeout: 30s
          revision-env: |
            APP_DB__DSN=postgresql+asyncpg://test:test@test:5432/test
            APP_RABBIT__DSN=${{ secrets.ENV_AMQP_URL }}
            APP_AUTH__TOKEN_URL=http://localhost:8000
            APP_AUTH__REFRESH_URL=http://localhost:8000
            APP_JWT__ACCESS_KEY_TTL=10
            APP_JWT__SIGNING_KEY=asdlkjsad
            APP_JWT__VERIFYING_KEY=asdlkasjd
            APP_JWT__REFRESH_TOKEN_TTL=10
            APP_DB__EXPIRE_ON_COMMIT=false
