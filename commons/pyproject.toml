[project]
name = "commons"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Artem Burenin", email = "burenin@mindbox.cloud" }
]
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=9.5.8",
    "asyncpg>=0.31.0",
    "asyncpg-stubs>=0.31.1",
    "dishka>=1.7.2",
    "fastapi>=0.124.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-jose[cryptography]>=3.5.0",
    "pytz>=2025.2",
    "sqlalchemy[asyncio]>=2.0.45",
]

[project.scripts]
commons = "commons:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
