[project]
name = "subscriptions"
version = "0.1.0"
description = "Subscriptions service"
readme = "README.md"
authors = [{ name = "Larkova Darina", email = "rerxori@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "commons",
    "dishka>=1.7.2",
    "fastapi>=0.124.2",
    "faststream>=0.6.4",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.45",
    "uvicorn>=0.38.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "alembic>=1.17.2",
    "httpx>=0.28.1",
    "aio-pika>=9.5.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["mypy>=1.19.0", "openapi-generator-cli>=7.17.0", "ruff>=0.14.8"]
tests = [
    "hypothesis>=6.148.7",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-bdd>=8.1.0",
    "testcontainers[postgres,rabbitmq]>=4.13.3",
]

[tool.uv.sources]
commons = { path = "../commons", editable = true }
