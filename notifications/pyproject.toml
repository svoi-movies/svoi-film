[project]
name = "notifications"
version = "0.1.0"
description = "Notification service"
readme = "README.md"
authors = [{ name = "Artem Burenin", email = "burenin@mindbox.cloud" }]
requires-python = ">=3.13"
dependencies = [
    "commons",
    "dishka>=1.7.2",
    "faststream>=0.6.4",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.12.0",
    "uvicorn>=0.38.0",
    "aio-pika>=9.5.8",
    "aiosmtplib>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["mypy>=1.19.0", "openapi-generator-cli>=7.17.0", "ruff>=0.14.8"]
tests = [
    "hypothesis>=6.148.7",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-bdd>=8.1.0",
    "testcontainers[postgres,rabbitmq]>=4.13.3",
]

[tool.uv.sources]
commons = { path = "../commons", editable = true }
